# ──────────────────────────────────────────────
# what-drives-xg  /  config.yaml
# Central configuration for the entire project.
# Edit this file to change competitions, seeds,
# or paths. Do NOT hardcode these values in scripts.
# ──────────────────────────────────────────────

# Random seeds (used everywhere for reproducibility)
seed: 42

# Paths (relative to repo root)
paths:
  data_dir: data/
  results_dir: results/
  processed_shots: results/shots_processed.parquet  # gitignored
  oof_dir: results/oof/         # out-of-fold predictions

# ──────────────────────────────────────
# Competition selection
# Filled in after checkpoint 1 data audit.
# ──────────────────────────────────────
competitions:
  # Core set: used for training and CV
  core: []            # PLACEHOLDER — to be filled after checkpoint 1

  # Held-out set: used only for transfer test (checkpoint 8)
  held_out: []        # PLACEHOLDER — to be filled after checkpoint 1

# ──────────────────────────────────────
# Modelling
# ──────────────────────────────────────
model:
  cv_folds: 5         # number of match-grouped CV folds
  n_bootstrap: 1000   # bootstrap iterations for CI on metrics
  # Orderings to average over for group-credit assignment
  orderings: 6        # number of random feature-group orderings

# ──────────────────────────────────────
# Exclusions (applied before any modelling)
# ──────────────────────────────────────
exclusions:
  # Shot types to drop from main model (kept in a separate filtered set)
  shot_types_excluded:
    - Penalty
  # Shootout shots must also be excluded.
  # The field and value used to identify them will be confirmed during
  # the Checkpoint 1 data audit and filled in here before Checkpoint 2.
  exclude_shootout: true   # mechanism TBD — pending data audit

# ──────────────────────────────────────
# Leakage policy (documentation only — enforcement is in src/leakage.py)
# ──────────────────────────────────────
leakage:
  forbidden_columns:
    - shot_outcome
    - shot_end_location
    - shot_saved_to_post
    - shot_saved_off_target
    - statsbomb_xg          # target benchmark, never a feature
    # Prefix-based rules (e.g. for the raw freeze-frame blob) will be
    # added here after the Checkpoint 1 data audit confirms the field names.
